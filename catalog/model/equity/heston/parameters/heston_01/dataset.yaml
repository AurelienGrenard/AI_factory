title: "Heston parameter dataset heston_01"
database_id: "heston_01"
model_family: "Heston"
catalog: "catalog/model/equity/heston/parameters/heston_01"
url: "https://datasets.ai-factory.example/v1/model/equity/heston/parameters/heston_01.json"
row_count: 1000
parameters:
  spot: "Initial spot."
  risk_free_rate: "Continuously compounded risk-free rate."
  dividend_yield: "Continuously compounded dividend yield."
  initial_variance: "Initial variance v0."
  kappa: "Variance mean-reversion speed."
  theta: "Long-run variance."
  gamma: "Volatility of variance."
  rho: "Spot/variance Brownian correlation."
dynamics:
  spot: "dS_t / S_t = (r - q) dt + sqrt(V_t) dW_t^S"
  variance: "dV_t = kappa (theta - V_t) dt + gamma sqrt(V_t) dW_t^V"
  correlation: "d<W^S, W^V>_t = rho dt"
construction:
  method: "ordered 90/10 core-stress construction"
  row_order:
    core: "rows 1-900"
    stress: "rows 901-1000"
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: "independent uniform sample"
      bounds:
        spot:
          - 1.0
          - 1.0
        risk_free_rate:
          - 0.001
          - 0.08
        dividend_yield:
          - 0.0
          - 0.06
        initial_variance:
          - 0.01
          - 0.12
        kappa:
          - 0.5
          - 4.0
        theta:
          - 0.01
          - 0.15
        rho:
          - -0.95
          - -0.25
      conditional_sampling:
        gamma:
          minimum: "max(sqrt(kappa * theta / 5.000000), 0.080000)"
          maximum: "min(sqrt(12.000000 * kappa * theta), 0.800000)"
          distribution: "uniform conditional on kappa and theta"
        purpose: "control the Feller ratio while keeping gamma plausible"
  stress:
    row_count: 100
    generation:
      method: "independent uniform sample"
      bounds:
        spot:
          - 1.0
          - 1.0
        risk_free_rate:
          - -0.03
          - 0.12
        dividend_yield:
          - 0.0
          - 0.1
        initial_variance:
          - 0.003
          - 0.3
        kappa:
          - 0.1
          - 8.0
        theta:
          - 0.003
          - 0.35
        rho:
          - -0.99
          - 0.25
      conditional_sampling:
        gamma:
          minimum: "max(sqrt(kappa * theta / 8.000000), 0.030000)"
          maximum: "min(sqrt(20.000000 * kappa * theta), 1.800000)"
          distribution: "uniform conditional on kappa and theta"
        purpose: "control the Feller ratio while keeping gamma plausible"
