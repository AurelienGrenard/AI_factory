title: "log-modulated rough Bergomi parameter dataset log_modulated_rough_bergomi_01"
database_id: "log_modulated_rough_bergomi_01"
model_family: "log-modulated rough Bergomi"
catalog: "catalog/model/equity/log_modulated_rough_bergomi/parameters/log_modulated_rough_bergomi_01"
url: "https://datasets.ai-factory.example/v1/model/equity/log_modulated_rough_bergomi/parameters/log_modulated_rough_bergomi_01.json"
row_count: 1000
parameters:
  spot: "Initial spot; fixed to 1."
  risk_free_rate: "Continuously compounded risk-free rate."
  dividend_yield: "Continuously compounded dividend yield."
  xi_0: "Flat initial forward variance."
  eta: "Log-variance volatility."
  hurst_exponent: "Power component H in [0, 1/2)."
  rho: "Spot/Volterra Brownian correlation."
  log_modulation_scale: "Positive logarithmic scale zeta."
  log_modulation_power: "Logarithmic power p>1."
dynamics:
  kernel: "C t^(H-1/2) max(zeta log(1/t),1)^(-p)."
  variance: "v=xi_0 exp(eta Y-eta^2 Var(Y)/2)."
  simulation: "Normalized arbitrary-kernel hybrid FFT."
construction:
  method: "ordered 90/10 core-stress construction"
  row_order:
    core: "rows 1-900"
    stress: "rows 901-1000"
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: "independent uniform sample"
      bounds:
        risk_free_rate:
          - 0.001
          - 0.08
        dividend_yield:
          - 0.0
          - 0.06
        xi_0:
          - 0.01
          - 0.09
        eta:
          - 0.5
          - 3.0
        hurst_exponent:
          - 0.01
          - 0.2
        rho:
          - -0.95
          - -0.2
        log_modulation_scale:
          - 0.03
          - 0.3
        log_modulation_power:
          - 1.2
          - 4.0
  stress:
    row_count: 100
    generation:
      method: "independent uniform sample"
      bounds:
        risk_free_rate:
          - -0.03
          - 0.12
        dividend_yield:
          - 0.0
          - 0.1
        xi_0:
          - 0.0025
          - 0.25
