title: "European Calls parameter dataset european_calls_01"
database_id: "european_calls_01"
product_family: "European Calls"
catalog: "catalog/product/european_calls/european_calls_01"
url: "https://datasets.ai-factory.example/v1/product/european_calls/european_calls_01.json"
row_count: 1000
parameters:
  strike: "Strike in normalized spot units."
  maturity: "Maturity in years."
payoff:
  expression: "max(S_T - K, 0)"
  scaling_rule: "V(s, K) = s * V(1, K / s)"
construction:
  method: "maturity-dependent exponential grid"
  rule: "For each T, x is linearly spaced on [-aT, aT] and K = exp(x)."
  grid:
    maturity:
      minimum: "1 / 12"
      maximum: 3.0
      count: 50
      spacing: "linear"
    strike:
      count_per_maturity: 20
      spacing: "linear in log-strike"
      conditional_bounds: "[exp(-aT), exp(aT)]"
      a: 0.2
