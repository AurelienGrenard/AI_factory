schema_version: 1
kind: product_parameters
dataset_id: phoenix_memory_autocalls_01
generator: generator.cpp
output:
  path: datasets/product/phoenix_memory_autocall/phoenix_memory_autocalls_01.json
  format: json
generation_output: catalog/product/phoenix_memory_autocall/phoenix_memory_autocalls_01/generation.yaml
product_family: Phoenix Memory Autocalls
row_count: 1000
time_convention:
  unit: business_day
  days_per_year: 252
parameters:
  maturity: Time from issuance to final redemption in business days.
  observation_interval: Business days between observation dates.
  autocall_barrier: Spot level triggering early redemption.
  coupon_barrier: Spot level releasing current and remembered coupons.
  protection_barrier: Final spot level protecting the normalized nominal.
  annual_coupon_rate: Annual coupon rate prorated over each observation interval.
payoff:
  coupon_memory: Missed coupons are paid at the next successful coupon observation.
  early_redemption: Before maturity, S_t >= autocall_barrier pays nominal 1 plus all
    due coupons and terminates the note.
  protected_redemption: At maturity, S_T >= protection_barrier repays nominal 1.
  unprotected_redemption: At maturity, S_T < protection_barrier repays S_T because
    S_0 = 1.
  final_coupon: Remembered coupons are lost unless S_T >= coupon_barrier.
  protection_monitoring: 'European: protection_barrier is observed only at maturity.'
construction:
  method: ordered 90/10 constrained core-stress sample
  row_order:
    core: rows 1-900
    stress: remaining rows
  core_share: 0.9
  stress_share: 0.1
  valuation_time: issuance
  reference_spot: 1.0
  nominal: 1.0
  sampling:
    regime_counts: 900 core rows and 100 stress rows
    observation_interval: uniform categorical draw within the selected regime
    observation_count: uniform integer draw among counts compatible with the regime
      maturity bounds
    continuous_parameters: uniform draws within the selected regime bounds
    barriers: draw protection first, then coupon above protection, then autocall above
      coupon
  calendar_rules:
  - maturity is an integer multiple of observation_interval
  - observation dates are i * observation_interval from issuance
  - core rows precede stress rows
  regimes:
    core:
      row_count: 900
      maturity:
      - 252
      - 1260
      observation_interval:
      - 21
      - 63
      autocall_barrier:
      - 0.95
      - 1.1
      coupon_barrier:
      - 0.55
      - 0.85
      protection_barrier:
      - 0.5
      - 0.7
      annual_coupon_rate:
      - 0.03
      - 0.15
    stress:
      row_count: 100
      maturity:
      - 126
      - 1764
      observation_interval:
      - 5
      - 126
      - 252
      autocall_barrier:
      - 0.8
      - 1.3
      coupon_barrier:
      - 0.3
      - 1.05
      protection_barrier:
      - 0.2
      - 0.9
      annual_coupon_rate:
      - 0.005
      - 0.3
  barrier_rule: protection_barrier <= coupon_barrier <= autocall_barrier
  paired_terms: Rows match phoenix_autocalls_01 term by term.
