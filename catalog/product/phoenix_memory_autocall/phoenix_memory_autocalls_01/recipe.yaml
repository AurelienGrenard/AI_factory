schema_version: 1
kind: "product_parameters"
dataset_id: "phoenix_memory_autocalls_01"
generator: "generator.cpp"
output:
  path: "datasets/product/phoenix_memory_autocall/phoenix_memory_autocalls_01.json"
  format: "json"
generation_output: "catalog/product/phoenix_memory_autocall/phoenix_memory_autocalls_01/generation.yaml"
url: "https://datasets.ai-factory.example/v1/product/phoenix_memory_autocalls/phoenix_memory_autocalls_01.json"
product_family: "Phoenix Memory Autocalls"
row_count: 1000
time_convention:
  unit: "business_day"
  days_per_year: 252
parameters:
  maturity: "Time from issuance to final redemption in business days."
  observation_interval: "Business days between observation dates."
  autocall_barrier: "Dimensionless ratio of the quoted spot level to the central model spot S0; 1.0 means 100% of S0."
  coupon_barrier: "Dimensionless ratio of the quoted spot level to the central model spot S0; 1.0 means 100% of S0."
  protection_barrier: "Dimensionless ratio of the quoted spot level to the central model spot S0; 1.0 means 100% of S0."
  annual_coupon_rate: "Annual coupon rate prorated over each observation interval."
payoff:
  coupon_memory: "Missed coupons are paid at the next successful coupon observation."
  early_redemption: "Before maturity, S_t >= autocall_barrier pays nominal 1 plus all due coupons and terminates the note."
  protected_redemption: "At maturity, S_T >= protection_barrier repays nominal 1."
  unprotected_redemption: "At maturity, S_T < protection_barrier repays S_T / S_ref on unit notional, with S_ref fixed at issuance."
  final_coupon: "Remembered coupons are lost unless S_T >= coupon_barrier."
  protection_monitoring: "European: protection_barrier is observed only at maturity."
  spot_level_quote:
    unit: "ratio_to_central_spot"
    resolution: "Each quoted strike/barrier is multiplied by the unbumped model S0 once for each model-product pair."
    sensitivity: "S0 reference and resolved contract levels remain fixed when model.spot is bumped; product-level derivatives are with respect to the quoted ratio."
construction:
  method: "ordered 90/10 constrained core-stress sample"
  row_order:
    core: "rows 1-900"
    stress: "remaining rows"
  core_share: 0.9
  stress_share: 0.1
  valuation_time: "issuance"
  spot_quote_convention: "Barriers are ratios to each paired model central S0; 1.0 represents 100%."
  nominal: 1.0
  sampling:
    regime_counts: "900 core rows and 100 stress rows"
    observation_interval: "uniform categorical draw within the selected regime"
    observation_count: "uniform integer draw among counts compatible with the regime maturity bounds"
    continuous_parameters: "uniform draws within the selected regime bounds"
    barriers: "draw protection first, then coupon above protection, then autocall above coupon"
  calendar_rules:
    - "maturity is an integer multiple of observation_interval"
    - "observation dates are i * observation_interval from issuance"
    - "core rows precede stress rows"
  regimes:
    core:
      row_count: 900
      maturity:
        - 252
        - 1260
      observation_interval:
        - 21
        - 63
      autocall_barrier:
        - 0.95
        - 1.1
      coupon_barrier:
        - 0.55
        - 0.85
      protection_barrier:
        - 0.5
        - 0.7
      annual_coupon_rate:
        - 0.03
        - 0.15
    stress:
      row_count: 100
      maturity:
        - 126
        - 1512
      observation_interval:
        - 5
        - 126
        - 252
      autocall_barrier:
        - 0.9
        - 1.2
      coupon_barrier:
        - 0.45
        - 0.95
      protection_barrier:
        - 0.4
        - 0.8
      annual_coupon_rate:
        - 0.01
        - 0.2
  barrier_rule: "protection_barrier <= coupon_barrier <= autocall_barrier"
  paired_terms: "Rows match phoenix_autocalls_01 term by term."
