title: "Straddles parameter dataset straddles_01"
database_id: "straddles_01"
product_family: "Straddles"
catalog: "catalog/product/equity/straddles/straddles_01"
url: "https://datasets.ai-factory.example/v1/product/straddles/straddles_01.json"
row_count: 1000
parameters:
  strike: "Common call and put strike in normalized spot units."
  maturity: "Maturity in years."
payoff:
  expression: "abs(S_T - K)"
  decomposition: "European call plus European put."
  scaling_rule: "V(s, K) = s * V(1, K / s)"
construction:
  method: "ordered 90/10 core-stress construction"
  row_order:
    core: "rows 1-900"
    stress: "rows 901-1000"
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: "maturity-dependent exponential grid"
      rule: "For each T, x is linearly spaced on [-aT, aT] and K = exp(x)."
      grid:
        maturity:
          minimum: 0.0833333
          maximum: 3.0
          count: 45
          spacing: "linear"
        strike:
          count_per_maturity: 20
          spacing: "linear in log-strike"
          conditional_bounds: "[exp(-aT), exp(aT)]"
          a: 0.2
  stress:
    row_count: 100
    generation:
      method: "maturity-dependent exponential grid"
      rule: "For each T, x is linearly spaced on [-aT, aT] and K = exp(x)."
      grid:
        maturity:
          minimum: 0.0192308
          maximum: 7.0
          count: 10
          spacing: "linear"
        strike:
          count_per_maturity: 10
          spacing: "linear in log-strike"
          conditional_bounds: "[exp(-aT), exp(aT)]"
          a: 0.2
  grid:
    maturity:
      core:
        minimum: 0.0833333
        maximum: 3.0
        count: 45
        spacing: "linear"
      stress:
        minimum: 0.0192308
        maximum: 7.0
        count: 10
        spacing: "linear"
    strike:
      core:
        count_per_maturity: 20
        conditional_bounds: "[exp(-aT), exp(aT)]"
        a: 0.2
      stress:
        count_per_maturity: 10
        conditional_bounds: "[exp(-aT), exp(aT)]"
        a: 0.2
      spacing: "linear in log-strike"
