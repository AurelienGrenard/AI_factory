title: "European Puts parameter dataset european_puts_01"
database_id: "european_puts_01"
product_family: "European Puts"
catalog: "catalog/product/equity/european_puts/european_puts_01"
url: "https://datasets.ai-factory.example/v1/product/european_puts/european_puts_01.json"
row_count: 1000
parameters:
  strike: "Strike in normalized spot units."
  maturity: "Maturity in years."
payoff:
  expression: "max(K - S_T, 0)"
  scaling_rule: "V(s, K) = s * V(1, K / s)"
construction:
  method: "maturity-dependent exponential grid"
  rule: "For each T, x is linearly spaced on [-aT, aT] and K = exp(x)."
  grid:
    maturity:
      minimum: "1 / 12"
      maximum: 3.0
      count: 50
      spacing: "linear"
    strike:
      count_per_maturity: 20
      spacing: "linear in log-strike"
      conditional_bounds: "[exp(-aT), exp(aT)]"
      a: 0.2
