title: "American Options parameter dataset american_options_01"
database_id: "american_options_01"
product_family: "American Options"
catalog: "catalog/product/equity/american_options/american_options_01"
url: "https://datasets.ai-factory.example/v1/product/american_options/american_options_01.json"
row_count: 1000
time_convention:
  unit: "business_day"
  days_per_year: 252
parameters:
  strike: "Strike in normalized spot units."
  maturity: "Maturity in business days."
  exercise_interval: "Business days between exercise dates."
payoff:
  expression: "max(side * (S_t - K), 0) at each exercise date; side = +1 call / -1 put"
  interpretation: "Continuous American exercise is approximated on discrete dates."
  scaling_rule: "V(s, K) = s * V(1, K / s)"
construction:
  method: "ordered 90/10 core-stress construction"
  row_order:
    core: "rows 1-900"
    stress: "rows 901-1000"
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: "maturity-dependent exponential grid"
      rule: "For each T in business days, x is linearly spaced on [-aT/252, aT/252] and K = exp(x)."
      grid:
        maturity:
          minimum: 21
          maximum: 756
          count: 45
          spacing: "linear"
        strike:
          count_per_maturity: 20
          spacing: "linear in log-strike"
          conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
          a: 0.2
  stress:
    row_count: 100
    generation:
      method: "maturity-dependent exponential grid"
      rule: "For each T in business days, x is linearly spaced on [-aT/252, aT/252] and K = exp(x)."
      grid:
        maturity:
          minimum: 10
          maximum: 1764
          count: 10
          spacing: "linear"
        strike:
          count_per_maturity: 10
          spacing: "linear in log-strike"
          conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
          a: 0.2
  grid:
    maturity:
      core:
        minimum: 21
        maximum: 756
        count: 45
        spacing: "linear"
      stress:
        minimum: 10
        maximum: 1764
        count: 10
        spacing: "linear"
    strike:
      core:
        count_per_maturity: 20
        conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
        a: 0.2
      stress:
        count_per_maturity: 10
        conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
        a: 0.2
      spacing: "linear in log-strike"
  exercise_interval_sampling:
    method: "uniform sample among feasible conventions"
    conventions:
      - "21 business days (monthly)"
      - "10 business days (semi-monthly)"
      - "5 business days (weekly)"
    exercise_dates: "maturity - n * exercise_interval, ..., maturity"
    constraint: "1 * exercise_interval < maturity"
    minimum_exercise_dates: 2
