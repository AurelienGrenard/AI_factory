title: "Forward-Start Options parameter dataset forward_start_options_01"
database_id: "forward_start_options_01"
product_family: "Forward-Start Options"
catalog: "catalog/product/equity/forward_start_options/forward_start_options_01"
url: "https://datasets.ai-factory.example/v1/product/forward_start_options/forward_start_options_01.json"
row_count: 1000
parameters:
  moneyness: "Strike multiplier applied to the reset spot."
  reset_time: "Time when the floating strike is fixed."
  maturity: "Maturity in years."
payoff:
  expression: "max(side * (S_T - moneyness * S_reset), 0), side = +1 call / -1 put"
construction:
  method: "maturity-dependent exponential grid"
  rule: "For each T, x is linearly spaced on [-aT, aT] and K = exp(x)."
  grid:
    maturity:
      minimum: "1 / 12"
      maximum: 3.0
      count: 50
      spacing: "linear"
    moneyness:
      count_per_maturity: 20
      spacing: "linear in log-strike"
      conditional_bounds: "[exp(-aT), exp(aT)]"
      a: 0.2
  reset_time:
    rule: "maturity / 2"
