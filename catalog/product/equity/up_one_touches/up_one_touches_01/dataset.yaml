title: "Up One-Touches parameter dataset up_one_touches_01"
database_id: "up_one_touches_01"
product_family: "Up One-Touches"
catalog: "catalog/product/equity/up_one_touches/up_one_touches_01"
url: "https://datasets.ai-factory.example/v1/product/up_one_touches/up_one_touches_01.json"
row_count: 1000
time_convention:
  unit: "business_day"
  days_per_year: 252
parameters:
  barrier: "Upper touch level in normalized spot units."
  cash_payoff: "Cash amount paid at maturity after a touch."
  maturity: "Maturity in business days."
payoff:
  expression: "cash_payoff if max(S_[0,T]) >= barrier; otherwise 0"
  payment_time: "maturity"
construction:
  method: "ordered 90/10 core-stress construction"
  row_order:
    core: "rows 1-900"
    stress: "rows 901-1000"
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: "maturity-dependent exponential grid"
      rule: "For each T in business days, x is linearly spaced on [-aT/252, aT/252] and K = exp(x)."
      grid:
        maturity:
          minimum: 21
          maximum: 756
          count: 45
          spacing: "linear"
        strike:
          count_per_maturity: 20
          spacing: "linear in log-strike"
          conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
          a: 0.2
  stress:
    row_count: 100
    generation:
      method: "maturity-dependent exponential grid"
      rule: "For each T in business days, x is linearly spaced on [-aT/252, aT/252] and K = exp(x)."
      grid:
        maturity:
          minimum: 5
          maximum: 1764
          count: 10
          spacing: "linear"
        strike:
          count_per_maturity: 10
          spacing: "linear in log-strike"
          conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
          a: 0.2
  grid:
    maturity:
      core:
        minimum: 21
        maximum: 756
        count: 45
        spacing: "linear"
      stress:
        minimum: 5
        maximum: 1764
        count: 10
        spacing: "linear"
    barrier:
      spacing: "linear in log-barrier"
      core:
        count_per_maturity: 20
        conditional_bounds: "[exp(0.05), exp(0.15 + 0.20 sqrt((T/252) / 3))]"
      stress:
        count_per_maturity: 10
        conditional_bounds: "[exp(0.01), exp(0.81 + 0.40 sqrt((T/252) / 7))]"
  rule: "For each T, the upper barrier is linearly spaced in log-space."
  cash_payoff: 1.0
