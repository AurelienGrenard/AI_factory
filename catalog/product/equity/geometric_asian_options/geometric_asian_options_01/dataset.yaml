title: "Geometric Asian Options parameter dataset geometric_asian_options_01"
database_id: "geometric_asian_options_01"
product_family: "Geometric Asian Options"
catalog: "catalog/product/equity/geometric_asian_options/geometric_asian_options_01"
url: "https://datasets.ai-factory.example/v1/product/geometric_asian_options/geometric_asian_options_01.json"
row_count: 1000
time_convention:
  unit: "business_day"
  days_per_year: 252
parameters:
  strike: "Strike in normalized spot units."
  maturity: "Maturity in business days."
payoff:
  expression: "max(side * (geometric_mean(S_[0,T]) - K), 0), side = +1 call / -1 put"
  monitoring: "Simulation-grid endpoints including 0 and T."
  scaling_rule: "V(s, K) = s * V(1, K / s)"
construction:
  method: "ordered 90/10 core-stress construction"
  row_order:
    core: "rows 1-900"
    stress: "rows 901-1000"
  core_share: 0.9
  stress_share: 0.1
  core:
    row_count: 900
    generation:
      method: "maturity-dependent exponential grid"
      rule: "For each T in business days, x is linearly spaced on [-aT/252, aT/252] and K = exp(x)."
      grid:
        maturity:
          minimum: 21
          maximum: 756
          count: 45
          spacing: "linear"
        strike:
          count_per_maturity: 20
          spacing: "linear in log-strike"
          conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
          a: 0.15
  stress:
    row_count: 100
    generation:
      method: "maturity-dependent exponential grid"
      rule: "For each T in business days, x is linearly spaced on [-aT/252, aT/252] and K = exp(x)."
      grid:
        maturity:
          minimum: 5
          maximum: 1764
          count: 10
          spacing: "linear"
        strike:
          count_per_maturity: 10
          spacing: "linear in log-strike"
          conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
          a: 0.15
  grid:
    maturity:
      core:
        minimum: 21
        maximum: 756
        count: 45
        spacing: "linear"
      stress:
        minimum: 5
        maximum: 1764
        count: 10
        spacing: "linear"
    strike:
      core:
        count_per_maturity: 20
        conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
        a: 0.15
      stress:
        count_per_maturity: 10
        conditional_bounds: "[exp(-aT/252), exp(aT/252)]"
        a: 0.15
      spacing: "linear in log-strike"
