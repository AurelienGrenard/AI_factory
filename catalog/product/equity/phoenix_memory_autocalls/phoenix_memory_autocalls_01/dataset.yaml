title: "Phoenix Memory Autocalls parameter dataset phoenix_memory_autocalls_01"
database_id: "phoenix_memory_autocalls_01"
product_family: "Phoenix Memory Autocalls"
catalog: "catalog/product/equity/phoenix_memory_autocalls/phoenix_memory_autocalls_01"
url: "https://datasets.ai-factory.example/v1/product/phoenix_memory_autocalls/phoenix_memory_autocalls_01.json"
row_count: 1000
parameters:
  maturity: "Time from issuance to final redemption in years."
  observation_interval: "Time in years between observation dates."
  autocall_barrier: "Spot level triggering early redemption."
  coupon_barrier: "Spot level releasing current and remembered coupons."
  protection_barrier: "Final spot level protecting the normalized nominal."
  annual_coupon_rate: "Annual coupon rate prorated over each observation interval."
payoff:
  coupon_memory: "Missed coupons are paid at the next successful coupon observation."
  early_redemption: "Before maturity, S_t >= autocall_barrier pays nominal 1 plus all due coupons and terminates the note."
  protected_redemption: "At maturity, S_T >= protection_barrier repays nominal 1."
  unprotected_redemption: "At maturity, S_T < protection_barrier repays S_T because S_0 = 1."
  final_coupon: "Remembered coupons are lost unless S_T >= coupon_barrier."
  protection_monitoring: "European: protection_barrier is observed only at maturity."
construction:
  method: "constrained core-tail random sample"
  valuation_time: "issuance"
  reference_spot: 1.0
  nominal: 1.0
  sampling:
    regime_counts: "900 core rows and 100 tail rows"
    observation_interval: "uniform categorical draw within the selected regime"
    observation_count: "uniform integer draw among counts compatible with the regime maturity bounds"
    continuous_parameters: "uniform draws within the selected regime bounds"
    barriers: "draw protection first, then coupon above protection, then autocall above coupon"
  calendar_rules:
    - "maturity is an integer multiple of observation_interval"
    - "observation dates are i * observation_interval from issuance"
    - "rows are shuffled after both regimes are generated"
  regimes:
    core:
      row_count: 900
      maturity:
        - "1 year"
        - "5 years"
      observation_interval:
        - "1 / 12"
        - "1 / 4"
      autocall_barrier:
        - 0.95
        - 1.1
      coupon_barrier:
        - 0.55
        - 0.85
      protection_barrier:
        - 0.5
        - 0.7
      annual_coupon_rate:
        - 0.03
        - 0.15
    tail:
      row_count: 100
      maturity:
        - "0.5 year"
        - "7 years"
      observation_interval:
        - "1 / 52"
        - "1 / 2"
        - "1"
      autocall_barrier:
        - 0.8
        - 1.3
      coupon_barrier:
        - 0.3
        - 1.05
      protection_barrier:
        - 0.2
        - 0.9
      annual_coupon_rate:
        - 0.005
        - 0.3
  barrier_rule: "protection_barrier <= coupon_barrier <= autocall_barrier"
  paired_terms: "Rows match phoenix_autocalls_01 term by term."
