title: "Athena Autocalls parameter dataset athena_autocalls_01"
database_id: "athena_autocalls_01"
product_family: "Athena Autocalls"
catalog: "catalog/product/equity/athena_autocalls/athena_autocalls_01"
url: "https://datasets.ai-factory.example/v1/product/athena_autocalls/athena_autocalls_01.json"
row_count: 1000
parameters:
  maturity: "Time from issuance to final redemption in years."
  observation_interval: "Time in years between observation dates."
  autocall_barrier: "Spot level triggering early redemption."
  protection_barrier: "Final spot level protecting the normalized nominal."
  annual_coupon_rate: "Annual gain rate accumulated until redemption."
payoff:
  intermediate_payments: "None: the accumulated gain is paid only at redemption."
  early_redemption: "At observation time t before maturity, S_t >= autocall_barrier pays 1 + annual_coupon_rate * t and terminates the note."
  successful_maturity: "At maturity, S_T >= autocall_barrier pays 1 + annual_coupon_rate * maturity."
  protected_redemption: "At maturity, protection_barrier <= S_T < autocall_barrier repays nominal 1 without gain."
  unprotected_redemption: "At maturity, S_T < protection_barrier repays S_T because S_0 = 1."
  protection_monitoring: "European: protection_barrier is observed only at maturity."
construction:
  method: "constrained core-tail random sample"
  valuation_time: "issuance"
  reference_spot: 1.0
  nominal: 1.0
  sampling:
    regime_counts: "900 core rows and 100 tail rows"
    observation_interval: "uniform categorical draw within the selected regime"
    observation_count: "uniform integer draw among counts compatible with the regime maturity bounds"
    continuous_parameters: "uniform draws within the selected regime bounds"
    barriers: "draw protection first, then autocall above protection"
  calendar_rules:
    - "maturity is an integer multiple of observation_interval"
    - "observation dates are i * observation_interval from issuance"
    - "rows are shuffled after both regimes are generated"
  regimes:
    core:
      row_count: 900
      maturity:
        - "1 year"
        - "5 years"
      observation_interval:
        - "1 / 12"
        - "1 / 4"
      autocall_barrier:
        - 0.95
        - 1.1
      protection_barrier:
        - 0.5
        - 0.7
      annual_coupon_rate:
        - 0.03
        - 0.15
    tail:
      row_count: 100
      maturity:
        - "0.5 year"
        - "7 years"
      observation_interval:
        - "1 / 52"
        - "1 / 2"
        - "1"
      autocall_barrier:
        - 0.8
        - 1.3
      protection_barrier:
        - 0.2
        - 0.9
      annual_coupon_rate:
        - 0.005
        - 0.3
  barrier_rule: "protection_barrier <= autocall_barrier"
