title: "Floorlets parameter dataset floorlets_01"
database_id: "floorlets_01"
product_family: "Floorlets"
catalog: "catalog/product/fixed_income/floorlets/floorlets_01"
url: "https://datasets.ai-factory.example/v1/product/floorlets/floorlets_01.json"
row_count: 1000
parameters:
  notional: "Normalized contract notional."
  strike: "Simple annualized floorlet strike."
  fixing_time: "Forward-rate fixing time T1 in years."
  payment_time: "Cashflow payment time T2 in years."
  accrual_period: "Year fraction delta for [T1, T2]."
payoff:
  expression: "N * delta * max(K - L(T1; T1, T2), 0)"
  payment_time: "T2"
  normalization: "N = 1"
construction:
  method: "Cartesian grid"
  rule: "Every fixing, accrual period, and strike combination."
  grid:
    fixing_time:
      minimum: "1 / 4"
      maximum: 5.0
      count: 20
      spacing: "linear"
    accrual_period:
      values:
        - "1 / 4"
        - "1 / 2"
      count: 2
    strike:
      minimum: "0 %"
      central_value: "4 %"
      maximum: "10 %"
      count: 25
      spacing: "cubic concentration around 4 %"
    notional:
      value: 1.0
