schema_version: 1
kind: curve_parameters
dataset_id: flat_01
generator: generator.cpp
output:
  path: datasets/curve/flat/flat_01.json
  format: json
generation_output: catalog/curve/flat/flat_01/generation.yaml
url: https://datasets.ai-factory.example/v1/curve/flat/flat_01.json
curve_family: Flat
row_count: 1000
parameters:
  rate: Constant continuously compounded zero and forward rate.
curve:
  zero_rate: z(0,T) = rate
  discount_factor: P(0,T) = exp(-rate T)
  instantaneous_forward: f(0,T) = rate
  forward_derivative: d_T f(0,T) = 0
  time_unit: years
  rate_convention: continuously compounded
construction:
  method: ordered 90/10 core-stress construction
  core:
    row_count: 900
    rate_bounds:
    - 0.001
    - 0.08
  stress:
    row_count: 100
    rate_bounds:
    - -0.02
    - 0.12
