$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ai-factory.example/schemas/dataset-generation"
title: AI Factory dataset generation metadata
type: object
required: [schema_version, status]
properties:
  schema_version:
    enum: [1, 2, 3, 4]
  status:
    const: complete
  recipe:
    type: object
    required: [path]
    properties:
      path:
        type: string
        pattern: '^(?:catalog|work)/.+/recipe\.yaml$'
      sha256:
        type: string
        pattern: '^[0-9a-f]{64}$'
  artifact:
    type: object
    required: [row_count]
    properties:
      path:
        type: string
        pattern: '^datasets/.+\.json$'
      row_count:
        type: integer
        minimum: 1
      sha256:
        type: string
        pattern: '^[0-9a-f]{64}$'
  inputs:
    type: object
  environment:
    type: object
    required: [hardware, software]
    properties:
      hardware:
        type: object
        required: [device]
        properties:
          device:
            enum: [cpu, gpu]
      software:
        type: object
        required: [cmake, cxx_compiler, cuda_compiler]
        properties:
          cmake:
            type: string
          cxx_compiler:
            type: string
          cuda_compiler:
            type: string
  execution:
    type: object
  timing:
    type: object
    properties:
      wall_seconds:
        type: [number, 'null']
        minimum: 0
      kernel_seconds:
        type: [number, 'null']
        minimum: 0
  provenance:
    type: object
  record_sha256:
    type: string
    pattern: '^[0-9a-f]{64}$'
  curation:
    type: object
    required: [source_sha256, removed_gradients]
    properties:
      source_sha256:
        type: string
        pattern: '^[0-9a-f]{64}$'
      removed_gradients:
        type: array
        uniqueItems: true
        items:
          type: string
    additionalProperties: false
allOf:
  - if:
      properties:
        schema_version:
          const: 1
    then:
      required: [recipe, artifact, execution, record_sha256]
  - if:
      properties:
        schema_version:
          const: 2
    then:
      required: [recipe, artifact, inputs, environment]
      properties:
        recipe:
          not:
            required: [sha256]
        artifact:
          required: [path, row_count, sha256]
        inputs:
          additionalProperties:
            type: object
            required: [path, sha256]
            properties:
              path:
                type: string
                pattern: '^datasets/.+\.json$'
              sha256:
                type: string
                pattern: '^[0-9a-f]{64}$'
            additionalProperties: false
      not:
        anyOf:
          - required: [record_sha256]
          - required: [execution]
          - required: [provenance]
  - if:
      properties:
        schema_version:
          const: 3
    then:
      required: [inputs, output, hardware, software]
      properties:
        schema_version:
          const: 3
        status:
          const: complete
        inputs:
          type: object
          additionalProperties:
            type: string
            pattern: '^[0-9a-f]{64}$'
        output:
          type: object
          required: [sha256]
          properties:
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
          additionalProperties: false
        hardware:
          type: object
          required: [device, cpu_model]
          properties:
            device:
              enum: [cpu, gpu]
            cpu_model:
              type: string
          additionalProperties: true
        software:
          type: object
          required: [cmake, cxx_compiler, cuda_compiler]
          properties:
            cmake:
              type: string
            cxx_compiler:
              type: string
            cuda_compiler:
              type: string
          additionalProperties:
            type: string
      additionalProperties: false
  - if:
      properties:
        schema_version:
          const: 4
    then:
      required: [inputs, output]
      properties:
        schema_version:
          const: 4
        status:
          const: complete
        inputs:
          type: object
          additionalProperties:
            type: object
            required: [path, sha256]
            properties:
              path:
                type: string
                pattern: '^datasets/.+\.json$'
              sha256:
                type: string
                pattern: '^[0-9a-f]{64}$'
            additionalProperties: false
        output:
          type: object
          required: [path, sha256]
          properties:
            path:
              type: string
              pattern: '^datasets/.+\.json$'
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
          additionalProperties: false
        hardware:
          type: object
          minProperties: 1
          properties:
            device:
              enum: [cpu, gpu]
            host: false
            index: false
            cuda_visible_devices: false
          additionalProperties:
            type: string
        software:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        timing:
          type: object
          required: [wall_seconds, duration]
          properties:
            wall_seconds:
              type: number
              minimum: 0
            duration:
              type: string
              pattern: '^(?:[0-9]+ j )?(?:[0-9]+ h )?(?:[0-9]+ min )?(?:[0-9]+ s(?: [0-9]+ ms)?|[0-9]+(?:\.[0-9]{1,3})? ms)$'
          additionalProperties: false
      additionalProperties: false
  - not:
      anyOf:
        - required: [dataset_id]
        - required: [database_id]
        - required: [validation]
        - required: [outputs]
        - required: [sensitivity]
        - required: [time_grid]
additionalProperties: true
